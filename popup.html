<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Auto-Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon-wrapper">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Form Auto-Saver</h1>
          <p class="brand-subtitle" id="currentDomain" title="Página ativa">Identificando site...</p>
        </div>
      </div>
      <button id="btnClearAll" class="btn-icon danger" title="Limpar todos os rascunhos desta página">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </header>

    <section class="toolbar-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="inputSearch" placeholder="Buscar rascunhos salvos..." autocomplete="off">
      </div>
      <span class="drafts-counter" id="draftsCounter">0 itens</span>
    </section>

    <main class="drafts-list" id="draftsContainer"></main>

    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <p class="empty-title">Nenhum rascunho por aqui</p>
      <p class="empty-desc">Conforme você preenche formulários nesta página, seus textos ficam salvos automaticamente aqui.</p>
    </div>

    <div class="toast-notification hidden" id="toastNotification">
      <span id="toastMessage"></span>
    </div>

    <footer class="app-footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Salvamento local ativo</span>
      </div>
      <span class="ttl-info">Expiração em 7 dias</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
